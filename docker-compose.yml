services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    # Limits tuned for a 4-thread / 15 GiB laptop: buffer pool is 256M (custom.cnf),
    # so 1 CPU + 1 GiB covers MariaDB plus connection overhead.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    env_file: .env.docker
    environment:
      TZ: America/Merida
    command: --default-time-zone='America/Merida'
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-config/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # uvicorn --reload runs a reloader parent + worker; 1.5 CPU absorbs re-parse
    # bursts and 768 MiB is ample for FastAPI + SQLAlchemy + aiomysql.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      TZ: America/Merida
    ports:
      - "8003:8000"
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    # nginx alpine serving static assets: 0.5 CPU + 128 MiB is plenty.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    ports:
      - "5173:3000"
    env_file: .env.docker
    depends_on:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  db_data:
